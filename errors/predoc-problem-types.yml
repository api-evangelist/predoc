generated: '2026-07-20'
method: derived
source: https://docs.predoc.ai/reference
format: standard-return-object
envelope: >-
  Responses use a standard return object carrying status and a message field. Not-found
  conditions return HTTP 404. Some operations return an explanatory message in the standard
  response object instead of failing hard when an action is not permitted (e.g. a patient
  locked to updates, or a record ineligible for update).
problems:
- status: 401
  title: Unauthorized
  detail: >-
    Missing, invalid, or expired JWT bearer token. Tokens expire after 5 minutes and must
    be refreshed.
  remediation: >-
    Obtain a fresh token from POST /v1/auth/token and send it in the Authorization header
    as a bearer token.
- status: 404
  title: Resource not found
  detail: No patient or resource found for the supplied identifier.
  source_operation: PatientController_getPatientInformation_v1
- status: 200-with-message
  title: Operation not possible
  detail: >-
    Update rejected because the patient/request has progressed past Open status (locked),
    or a search returned no matching patient; an explanatory message is returned in the
    standard response object rather than an error status.
  source_operation: PatientController_updatePatientInformation_v1
notes: >-
  Derived from documented status codes and response semantics in the Partner API reference.
  Predoc does not publish an RFC 9457 problem-types registry; this catalog captures the
  standard return-object model as documented, without fabricating additional codes.
