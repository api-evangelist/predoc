openapi: 3.2.0
info:
  title: Predoc Partner Retrieval API
  description: API for the Predoc platform to allow partners to request the retrieval of patient records.
  version: '1.1'
  contact: {}
servers:
- url: https://partner-api-stage.predoc.ai/api
tags:
- name: Retrieval
paths:
  /v1/retrievals/previous-providers/{retrievalId}:
    get:
      description: Gets the current status for a manual previous-provider retrieval by retrieval UUID.
      operationId: RetrievalController_getRetrieval_v1
      parameters:
      - name: retrievalId
        required: true
        in: path
        description: Retrieval id UUID.
        schema:
          format: uuid
          example: 11111111-1111-4111-8111-111111111111
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrievalStatusRespDto'
      security:
      - bearer: []
      summary: Get Previous-Provider Retrieval Status
      tags:
      - Retrieval
  /v1/retrievals/previous-providers/{retrievalId}/close:
    post:
      description: 'Requests asynchronous closure of a manual previous-provider retrieval. The retrieval status updates when closure finishes.


        > **Billing notice:** Closing a previous-provider retrieval after it has been initiated counts as a billable event.'
      operationId: RetrievalController_closeRetrieval_v1
      parameters:
      - name: retrievalId
        required: true
        in: path
        description: Retrieval id UUID.
        schema:
          format: uuid
          example: 11111111-1111-4111-8111-111111111111
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              example: {}
      responses:
        '202':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrievalCloseRespDto'
      security:
      - bearer: []
      summary: Close Previous-Provider Retrieval
      tags:
      - Retrieval
components:
  schemas:
    RetrievalCloseRespDto:
      type: object
      properties:
        retrievalId:
          type: string
          description: Previous provider retrieval identifier UUID.
          format: uuid
          example: 11111111-1111-4111-8111-111111111111
        requestId:
          type: string
          description: Predoc request identifier for the record request associated with this retrieval.
          format: uuid
        accepted:
          type: boolean
          description: Whether the close request was accepted for asynchronous processing.
          example: true
        message:
          type: string
          description: Status message for the close request.
          example: Closure request accepted. Retrieval status will update shortly.
      required:
      - retrievalId
      - requestId
      - accepted
      - message
    RetrievalStatusRespDto:
      type: object
      properties:
        retrievalId:
          type: string
          description: Manual retrieval identifier UUID.
          format: uuid
          example: 11111111-1111-4111-8111-111111111111
        partnerPatientId:
          type: string
          description: Partner patient ID that owns this retrieval.
          format: uuid
        requestId:
          type: string
          description: Predoc request identifier for the record request associated with this retrieval.
          format: uuid
        status:
          type: string
          description: Current retrieval status.
          example: Processing
        statusGroup:
          type: string
          description: Normalized retrieval status group.
          example: PROCESSING
        updatedAt:
          type: string
          description: Timestamp when the retrieval was last updated.
          format: date-time
        canClose:
          type: boolean
          description: Whether the retrieval can currently be closed.
          example: true
      required:
      - retrievalId
      - partnerPatientId
      - requestId
      - status
      - statusGroup
      - updatedAt
      - canClose
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
