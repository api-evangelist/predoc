components:
  schemas:
    EncounterTypeCodeDto:
      type: object
      properties:
        code:
          type:
          - string
          - 'null'
        codeSystem:
          type:
          - string
          - 'null'
        display:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
      required:
      - code
      - codeSystem
      - display
      - name
    PreviousProviderInpDto:
      type: object
      properties:
        orgName:
          type: string
          description: Full name of the organization provider. This is only required when `providerFirstName` and `providerLastName` are not used.
        providerFirstName:
          type: string
          description: First name of the provider. This is only required when `orgName` is not used.
        providerLastName:
          type: string
          description: Last name of the provider. This is only required when `orgName` is not used.
        practiceName:
          type: string
          description: Provider's practice name.
        orgAddress:
          description: Physical address of the organization's provider.
          allOf:
          - $ref: '#/components/schemas/AddressPreviousProviderInpDto'
        orgPhoneCountryCode:
          type: string
          default: '+1'
          deprecated: true
          description: Country code of the organization's phone number with a + at the beginning.
          example: '+1'
        orgPhoneNumber:
          type: string
          description: Phone number of the organization, with no special characters (digits only).
          example: '5553643856'
        orgFaxNumber:
          type: string
          description: Fax number of the organization, with no special characters (digits only).
          example: '5553643856'
        datesOfService:
          description: Date range of when the organization provided care to the patient.
          allOf:
          - $ref: '#/components/schemas/RequestDatesOfServiceInpDto'
        specificMedicalRecordRequested:
          type: string
          description: Type of custom document requested, if necessary.
          example: oncology
      required:
      - orgName
      - providerFirstName
      - providerLastName
      - datesOfService
    PatientAdditionalRecordsDto:
      type: object
      properties:
        partnerPatientId:
          type: string
          description: Partner patient ID for use when making patient requests.
          format: uuid
        additionalRecords:
          description: List of additional records for the requested patient, if any.
          type: array
          items:
            $ref: '#/components/schemas/AdditionalRecordDto'
      required:
      - partnerPatientId
      - additionalRecords
    ProviderFacilityNotesResponseDto:
      type: object
      properties:
        partnerPatientId:
          type: string
          description: Partner-facing patient identifier from the request path.
          example: 11111111-1111-4111-8111-111111111111
        patientKey:
          type: string
          description: Patient key stored in core-api.
          example: patient-key-123
        classificationGroupType:
          type: string
          enum:
          - provider-facility-notes
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProviderFacilityNoteItemDto'
      required:
      - partnerPatientId
      - patientKey
      - classificationGroupType
      - items
    LabTestDocumentUrlDto:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the lab test document.
          format: uuid
        url:
          type: string
          description: Signed URL to access the lab test document.
          format: url
          example: https://example.com/document.pdf
        createdAt:
          format: date-time
          type: string
          description: Date and time when the lab test document was first created.
      required:
      - id
      - url
    VitalsResponseDto:
      type: object
      properties:
        partnerPatientId:
          type: string
          description: Partner-facing patient identifier from the request path.
          example: 11111111-1111-4111-8111-111111111111
        patientKey:
          type: string
          description: Patient key stored in core-api.
          example: patient-key-123
        classificationGroupType:
          type: string
          enum:
          - vitals
        items:
          type: array
          items:
            $ref: '#/components/schemas/VitalItemDto'
      required:
      - partnerPatientId
      - patientKey
      - classificationGroupType
      - items
    PatientInfoResponseDto:
      type: object
      properties:
        partnerPatientId:
          type: string
          description: Unique identifier for the patient.
          format: uuid
        patientKey:
          type: string
          description: Yet another unique identifier for the patient.
          example: PAPI-123456789012
        firstName:
          type: string
          description: First name of the patient.
          example: Martha
        middleName:
          type: string
          description: Middle name of the patient.
          example: Sara
        lastName:
          type: string
          description: Last name of the patient.
          example: Rangel
        genderName:
          type: string
          description: Gender of the patient.
          example: female
        dateOfBirth:
          type: string
          description: Date of birth of the patient.
          example: '1970-03-10'
        phoneNumber:
          type: string
          description: Phone number of the patient, without spaces or dashes.
          example: '7175501675'
        addressLine1:
          type: string
          description: Address line 1 of the patient address.
          example: 4990 HOOVER RD
        addressLine2:
          type: string
          description: Address line 2 of the patient address.
          example: APT 227
        city:
          type: string
          description: City of the patient address.
          example: GROVE CITY
        state:
          type: string
          description: State of the patient address.
          example: OH
        postalCode:
          type: string
          description: Postal code of the patient address. 5 digits
          example: '43123'
        primaryLanguage:
          type: string
          description: Primary language of the patient.
          example: english
      required:
      - partnerPatientId
      - patientKey
      - firstName
      - middleName
      - lastName
      - genderName
      - dateOfBirth
      - phoneNumber
      - addressLine1
      - addressLine2
      - city
      - state
      - postalCode
      - primaryLanguage
    DocumentDto:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the document.
          format: uuid
        title:
          type: string
          description: Title of the document. Literal `|` separators are removed from this partner-facing display text.
          example: Discharge Summary
        comments:
          type: string
          description: Comments on the document. Literal `|` separators are removed from this partner-facing display text.
          example: Reviewed by provider
        date:
          type: string
          description: Document date.
        createdAt:
          format: date-time
          type: string
          description: Date the document was created.
        images:
          description: Document URLs for the document. These can be used to download the document information.
          type: array
          items:
            $ref: '#/components/schemas/DocumentUrlDto'
        documentType:
          type:
          - string
          - 'null'
          description: Document type/category when provided by the upstream service. Literal `|` separators are removed from this partner-facing display text. If the document type is missing or blank, this field is null.
          example: CONSENT AND AUTHORIZATION FORMS
        indexedRecordSpliceType:
          type:
          - string
          - 'null'
          description: Spliced indexed record classification. Null means no splice metadata is available for the document.
          enum:
          - CANVAS_SET
          - SEGMENT_SET
          - PRESPLICED
      required:
      - id
      - title
      - comments
      - date
      - createdAt
      - images
      - documentType
      - indexedRecordSpliceType
    VaccineDocumentVaccineDto:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the vaccine.
          format: uuid
        type:
          description: Vaccine type information.
          allOf:
          - $ref: '#/components/schemas/VaccineTypeDto'
        alternateName:
          type:
          - string
          - 'null'
          description: Alternate name for the vaccine, which may be more widely-used.
          example: someOtherVaccine
        date:
          type: string
          description: Date the vaccine was administered.
          format: date
        comments:
          type: string
          description: Comments on the vaccine.
          example: The quick brown fox jumps over the lazy dog.
      required:
      - id
      - date
      - comments
    VaccineDocumentDto:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the vaccine document.
          format: uuid
        createdAt:
          format: date-time
          type: string
          description: Date the vaccine document was created.
        images:
          description: Document URLs for the vaccine document. These can be used to download the images.
          type: array
          items:
            $ref: '#/components/schemas/VaccineDocumentUrlDto'
        indexedRecordSpliceType:
          type:
          - string
          - 'null'
          description: Spliced indexed record classification. Null means no splice metadata is available for the vaccine document.
          enum:
          - CANVAS_SET
          - SEGMENT_SET
          - PRESPLICED
        vaccines:
          description: Vaccines and immunizations contained within this document.
          type: array
          items:
            $ref: '#/components/schemas/VaccineDocumentVaccineDto'
      required:
      - id
      - createdAt
      - images
      - indexedRecordSpliceType
      - vaccines
    PatientFacesheetOutputDto:
      type: object
      properties:
        partnerPatientId:
          type: string
          description: Partner patient ID for use when making patient requests.
          format: uuid
        facesheet:
          $ref: '#/components/schemas/FacesheetOutputDto'
      required:
      - partnerPatientId
      - facesheet
    ImagingTypeDto:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the imaging type.
          format: uuid
        name:
          type: string
          description: Type name for the imaging process. This is not the name of the image, but the type of image. Literal `|` separators are removed from this partner-facing display text.
          example: xray
        displayName:
          type: string
          description: Display name for the imaging type. This is a more user-friendly name. Literal `|` separators are removed from this partner-facing display text.
          example: X-Ray
      required:
      - id
      - name
      - displayName
    ImagingResultDto:
      type: object
      properties:
        id:
          type: string
