  /v2/patients/{patientId}/documents/search:
    post:
      description: 'Searches the patient’s available documents using the supplied criteria. Results follow the organization’s document-set delivery mode: `CANVAS_SET` includes `CANVAS_SET`, `PRESPLICED`, and untagged historical records; `SEGMENT_SET` includes `SEGMENT_SET`, `PRESPLICED`, and untagged historical records. If no mode is configured, `CANVAS_SET` behavior applies. Partner-facing display text is returned without literal `|` separators, while identifiers, URLs, categories, dates, and splice metadata are preserved as received.'
      operationId: PatientController_searchPatientDocuments_v2
