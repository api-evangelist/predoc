        in: path
        description: Unique identifier of the patient.
        schema:
          format: uuid
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientDocumentsDto'
      security:
      - bearer: []
      summary: Get Patient Documents
      tags:
