openapi: 3.2.0
info:
  title: Predoc Partner Patient API
  description: API for the Predoc platform to allow partners to request the retrieval of patient records.
  version: '1.1'
  contact: {}
servers:
- url: https://partner-api-stage.predoc.ai/api
tags:
- name: Patient
  description: ''
paths:
  /v1/patients:
    get:
      description: '> **Deprecated:** Supplying search criteria in the request body will be removed in a future release. Use query parameters instead.


        Searches for patients using the supplied demographic criteria. Returned patient IDs can be used with `GET /patients/{patientId}` to retrieve complete patient information. If no patient matches, the response contains an empty patient ID and an explanatory message.'
      operationId: PatientController_searchPatientsByInformation_v1
      parameters:
      - name: patientKey
        required: false
        in: query
        description: Patient Key.
        schema:
          minLength: 17
          maxLength: 17
          example: PAPI-123456789012
          type: string
      - name: firstName
        required: false
        in: query
        description: First name of the patient.
        schema:
          minLength: 2
          maxLength: 45
          example: Martha
          type: string
      - name: lastName
        required: false
        in: query
        description: Last name of the patient.
        schema:
          minLength: 2
          maxLength: 60
          example: Rangel
          type: string
      - name: phoneNumber
        required: false
        in: query
        description: Phone number of the patient, digits only.
        schema:
          minLength: 10
          maxLength: 10
          example: '7175501675'
          type: string
      - name: dateOfBirth
        required: false
        in: query
        description: Date of birth of the patient, in `YYYY-MM-DD` format.
        schema:
          format: date-time
          example: '1970-03-10'
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientSearchBodyInput'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PatientInfoResponseDto'
      security:
      - bearer: []
      summary: Search Patients by Information
      tags:
      - Patient
  /v1/patients/{patientId}:
    get:
      description: Gets the full information for the specified patient. If no patient is found with the corresponding ID, a 404 error will be returned.
      operationId: PatientController_getPatientInformation_v1
      parameters:
      - name: patientId
        required: true
        in: path
        description: Unique identifier of the patient.
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientInfoResponseDto'
      security:
      - bearer: []
      summary: Get Patient Information
      tags:
      - Patient
    patch:
      description: Updates patient information while the patient is in an `Open` status. If any request for the patient has progressed beyond `Open`, the patient information is locked and cannot be updated. When an update is not allowed, the standard response object explains why.
      operationId: PatientController_updatePatientInformation_v1
      parameters:
      - name: patientId
        required: true
        in: path
        description: Unique identifier of the patient.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePatientInformationInpDto'
      responses:
        '200':
          description: The patient information was handled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdatePatientInformationRespDto'
      security:
      - bearer: []
      summary: Update Patient Information
      tags:
      - Patient
  /v1/patients/{patientId}/additional-records:
    get:
      description: Gets a list of additional records for the patient by ID. These can be downloaded via their `url` property. Partner-facing document display text fields are returned without literal `|` separators. Identifiers, URLs, statuses, dates, splice metadata, and source metadata are preserved as received.
      operationId: PatientDocumentsController_getPatientAdditionalRecords_v1
      parameters:
      - name: patientId
        required: true
        in: path
        description: Unique identifier of the patient.
        schema:
          format: uuid
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientAdditionalRecordsDto'
      security:
      - bearer: []
      summary: Get Patient Additional Records
      tags:
      - Patient
  /v1/patients/{patientId}/curated-patient-data/{classificationGroupType}:
    get:
      description: 'Returns curated patient data for one classification group. The response schema is selected by `classificationGroupType` and identified by the matching discriminator in the response body. Partner-facing display text is returned without literal `|` separators, while identifiers, patient keys, URLs, source metadata, codes, statuses, dates, timestamps, and contact fields are preserved as received.


        ### Availability


        Curated Data availability depends on your Predoc contract. Use this endpoint when structured clinical data is included in your workflow; otherwise, use the document endpoints to retrieve patient records in their original formats. Contact your account manager if you are unsure which endpoints are enabled for your organization.'
      operationId: CuratedPatientDataController_getCuratedPatientData_v1
      parameters:
      - name: patientId
        required: true
        in: path
        description: Unique identifier of the patient.
        schema:
          type: string
      - name: classificationGroupType
        required: true
        in: path
        description: Curated patient data classification group to retrieve.
        schema:
          type: string
          enum:
          - allergies
          - demographics
          - encounters
          - family-history
          - imaging-notes
          - labs
          - medications
          - other
          - pathology-results
          - problems
          - procedure-notes
          - procedures
          - provider-facility-notes
          - providers
          - social-history
          - vaccinations
          - vitals
      responses:
        '200':
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/AllergiesResponseDto'
                - $ref: '#/components/schemas/DemographicsResponseDto'
                - $ref: '#/components/schemas/EncountersResponseDto'
                - $ref: '#/components/schemas/ProblemsResponseDto'
                - $ref: '#/components/schemas/ImagingNotesResponseDto'
                - $ref: '#/components/schemas/LabsResponseDto'
                - $ref: '#/components/schemas/MedicationsResponseDto'
                - $ref: '#/components/schemas/OtherResponseDto'
                - $ref: '#/components/schemas/PathologyResultsResponseDto'
                - $ref: '#/components/schemas/ProceduresResponseDto'
                - $ref: '#/components/schemas/ProcedureNotesResponseDto'
                - $ref: '#/components/schemas/VaccinationsResponseDto'
                - $ref: '#/components/schemas/FamilyHistoryResponseDto'
                - $ref: '#/components/schemas/ProviderFacilityNotesResponseDto'
                - $ref: '#/components/schemas/ProvidersResponseDto'
                - $ref: '#/components/schemas/SocialHistoryResponseDto'
                - $ref: '#/components/schemas/VitalsResponseDto'
                discriminator:
                  propertyName: classificationGroupType
                  mapping:
                    allergies: '#/components/schemas/AllergiesResponseDto'
                    demographics: '#/components/schemas/DemographicsResponseDto'
                    encounters: '#/components/schemas/EncountersResponseDto'
                    problems: '#/components/schemas/ProblemsResponseDto'
                    imaging-notes: '#/components/schemas/ImagingNotesResponseDto'
                    labs: '#/components/schemas/LabsResponseDto'
                    medications: '#/components/schemas/MedicationsResponseDto'
                    other: '#/components/schemas/OtherResponseDto'
                    pathology-results: '#/components/schemas/PathologyResultsResponseDto'
                    procedures: '#/components/schemas/ProceduresResponseDto'
                    procedure-notes: '#/components/schemas/ProcedureNotesResponseDto'
                    vaccinations: '#/components/schemas/VaccinationsResponseDto'
                    family-history: '#/components/schemas/FamilyHistoryResponseDto'
                    provider-facility-notes: '#/components/schemas/ProviderFacilityNotesResponseDto'
                    providers: '#/components/schemas/ProvidersResponseDto'
                    social-history: '#/components/schemas/SocialHistoryResponseDto'
                    vitals: '#/components/schemas/VitalsResponseDto'
              examples:
                allergies:
                  summary: Allergies Response
                  value:
                    classificationGroupType: allergies
                    partnerPatientId: 11111111-1111-4111-8111-111111111111
