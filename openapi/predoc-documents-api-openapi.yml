openapi: 3.2.0
info:
  title: Predoc Partner Documents API
  description: API for the Predoc platform to allow partners to request the retrieval of patient records.
  version: '1.1'
  contact: {}
servers:
- url: https://partner-api-stage.predoc.ai/api
tags:
- name: Documents
  description: ''
paths:
  /v1/documents/{documentId}:
    get:
      description: 'Returns the status of a clinical-summary document request. Use the `patientSummaryRequestId` returned when requesting a patient clinical summary as the `documentId` path parameter.


        Possible statuses are `QUEUEING`, `QUEUED`, `GENERATING`, `ERROR`, and `READY`.'
      operationId: DocumentController_getPatientClinicalSummary_v1
      parameters:
      - name: documentId
        required: true
        in: path
        description: Document id.
        schema:
          type: string
      responses:
        '200':
          description: The status of the document request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientSummaryResDto'
      security:
      - bearer: []
      summary: Document Status Request
      tags:
      - Documents
components:
  schemas:
    PatientSummaryResDto:
      type: object
      properties:
        patientSummaryRequestId:
          type: string
          description: Identifier that is used in subsequent API requests to check the status and retrieve the patient summary.
          format: uuid
        patientSummaryRequestStatus:
          type: string
          description: Status of the patient summary request.
          enum:
          - QUEUEING
          - QUEUED
          - GENERATING
          - ERROR
          - READY
          example: QUEUED
        patientSummaryRequestStatusMessage:
          type: string
          description: Any messages about the status of the patient summary request. This can include any errors that may have occurred during the request or notifications that the patient doesn't contain any of the requested categories.
          example: Patient summary request submitted successfully
        documentLink:
          type: string
          description: Once the document is in the `READY` status, this is the signed URL to download the document. This URL will expire after 24 hours.
          format: url
          example: https://example.com/patient-summary.pdf
      required:
      - patientSummaryRequestStatus
      - patientSummaryRequestStatusMessage
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
