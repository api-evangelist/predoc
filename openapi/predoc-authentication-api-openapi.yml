openapi: 3.2.0
info:
  title: Predoc Partner Authentication API
  description: API for the Predoc platform to allow partners to request the retrieval of patient records.
  version: '1.1'
  contact: {}
servers:
- url: https://partner-api-stage.predoc.ai/api
tags:
- name: Authentication
  description: ''
paths:
  /v1/auth/token:
    post:
      description: 'Validates the supplied client credentials and returns a JWT access token for authenticating subsequent requests to the Predoc Partner API.


        Provide `client_id` and `secret_key` in the request body. If the credentials are valid, the JWT is returned in the `access_token` field.


        ### Using the token


        Include the token in the `Authorization` header for subsequent requests:


        ```http

        Authorization: Bearer

        ```


        ### Token expiration


        Access tokens are valid for 5 minutes and should be refreshed before they expire.'
      operationId: AuthController_signIn_v1
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetAccessTokenInput'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAccessTokenResponse'
      summary: Get Access Token
      tags:
      - Authentication
components:
  schemas:
    GetAccessTokenInput:
      type: object
      properties:
        client_id:
          type: string
          description: Client ID of the application requesting the access token.
          example: test_account
        secret_key:
          type: string
          description: Client secret of the application requesting the access token.
          example: $up3r$3cr3tK3y!
      required:
      - client_id
      - secret_key
    GetAccessTokenResponse:
      type: object
      properties:
        access_token:
          type: string
          description: Access token JWT that can be used for authenticated requests.
          example: eyJh...od4w
      required:
      - access_token
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
