aid: predoc
name: Predoc
description: >-
  Predoc is an AI-native medical records platform that automates the retrieval,
  aggregation, normalization, de-duplication, and structured delivery of complete
  patient histories. It queries health information exchanges (HIEs) and initiates
  outreach to non-connected providers, ingests faxes, PDFs, and digital formats,
  and delivers clean, FHIR-compliant clinical data to healthcare organizations and
  clinical research teams via a REST Partner API, file exports, or direct EHR
  integration. The Predoc Partner API (v1.4.1) exposes patient management,
  record-retrieval requests, record uploads, granular clinical document endpoints
  (medications, labs, imaging, procedures, notes, vaccines, allergies), clinical
  summaries, and webhook event notifications, secured with short-lived JWT bearer
  tokens.
